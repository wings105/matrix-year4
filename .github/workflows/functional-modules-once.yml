name: Functional modules repair once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/functional-modules-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair learning interactions
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = []
          replacements.append((
            '<button class="btn primary" onclick="go(\'learn\')">▶ Mula Misi Hari Ini</button>',
            '<button class="btn primary" onclick="startMission()">▶ Mula Misi Day Ini</button>'
          ))
          replacements.append((
            '<div class="metric"><small>Progress Hari Ini</small><b id="todayPct">0%</b>',
            '<div class="metric"><small id="progressLabel">Progress Day 1</small><b id="todayPct">0%</b>'
          ))
          replacements.append((
            '<section id="screen-learn" class="screen">\n  <div class="top"><div><h1>📚 Belajar</h1><div class="muted">Quiz ringkas, terus feedback dan jawapan salah masuk Buku Silap.</div></div><div class="chips"><button class="chip" onclick="setLang(\'bm\')">BM</button><button class="chip" onclick="setLang(\'en\')">EN</button><button class="chip" onclick="setLang(\'dual\')">Dwi</button></div></div>\n  <div class="panel" style="max-width:760px">',
            '<section id="screen-learn" class="screen">\n  <div class="top"><div><h1>📚 Belajar</h1><div class="muted">Buka modul Day, jawab latihan dan progress akan sync ke profil ini.</div></div><div class="chips"><button class="chip" onclick="setLang(\'bm\')">BM</button><button class="chip" onclick="setLang(\'en\')">EN</button><button class="chip" onclick="setLang(\'dual\')">Dwi</button></div></div>\n  <div id="missionContext" class="notice hidden" style="max-width:760px"></div>\n  <div class="panel" style="max-width:760px">'
          ))
          replacements.append((
            '<div class="panel" style="margin-top:14px"><h3>Badge</h3><p>🌱 Starter — mula Day 1</p><p>📚 Consistent Learner — lengkap 20 tugasan</p><p>🧠 Error Hunter — baiki kesalahan</p><p>🏅 MATRIX Warrior — lengkap Day 1–Day 8</p></div>',
            '<div class="panel" style="margin-top:14px"><h3>Badge</h3><div id="badgeList"></div></div>'
          ))
          replacements.append((
            'let currentDay=1,currentQuiz=null,idTimer=null,parentIdTimer=null,parentChildrenCache=[];',
            "let currentDay=1,currentQuiz=null,currentTask=null,idTimer=null,parentIdTimer=null,parentChildrenCache=[];\nconst quizCursor={Math:-1,Science:-1,BM:-1,English:-1};"
          ))
          replacements.append((
            "  renderDays();renderTasks();renderSubjects();renderMistakes();\n  if(!currentQuiz)newQuestion('Math');",
            "  renderDays();renderTasks();renderSubjects();renderMistakes();renderRewards();renderMissionContext();\n  if(!currentQuiz)newQuestion('Math');"
          ))
          replacements.append((
            "function selectDay(day){currentDay=day;renderDays();renderTasks()}",
            "function selectDay(day){currentDay=day;currentTask=null;renderDays();renderTasks();renderMissionContext();}"
          ))
          replacements.append((
            "  const d=DAYS[currentDay-1];$('heroTitle').textContent=`Day ${currentDay} — ${d.theme}`;$('heroDesc').textContent=d.desc;$('themeText').textContent=`Day ${currentDay}: ${d.theme}`;$('targetText').textContent=d.desc;\n  $('tasks').innerHTML=d.tasks.map((t,i)=>{const key=`d${currentDay}-t${i}`;return `<label class=\"task\"><input type=\"checkbox\" ${progressDone(currentDay,key)?'checked':''} onchange=\"toggleTask(${currentDay},'${key}',this)\"><div><b>${safe(t)}</b><small>Sync ke profil @${safe(state.student.studentId)}</small></div><span class=\"tag\">${currentDay}.${i+1}</span></label>`}).join('');\n  const done=d.tasks.filter((_,i)=>progressDone(currentDay,`d${currentDay}-t${i}`)).length;const pct=Math.round(done/d.tasks.length*100);$('todayPct').textContent=pct+'%';$('todayBar').style.width=pct+'%';",
            "  const d=DAYS[currentDay-1];$('heroTitle').textContent=`Day ${currentDay} — ${d.theme}`;$('heroDesc').textContent=d.desc;$('themeText').textContent=`Day ${currentDay}: ${d.theme}`;$('targetText').textContent=d.desc;$('progressLabel').textContent=`Progress Day ${currentDay}`;\n  $('tasks').innerHTML=d.tasks.map((t,i)=>{const key=`d${currentDay}-t${i}`;const done=progressDone(currentDay,key);return `<label class=\"task\"><input type=\"checkbox\" ${done?'checked':''} onchange=\"toggleTask(${currentDay},'${key}',this)\"><div><b>${safe(t)}</b><small>${done?'Selesai & sync ✓':'Belum selesai'} • ${currentDay}.${i+1}</small></div><button type=\"button\" class=\"btn soft task-open\" onclick=\"event.preventDefault();event.stopPropagation();startTaskModule(${currentDay},${i})\">${done?'Ulang':'Buka'}</button></label>`}).join('');\n  const done=d.tasks.filter((_,i)=>progressDone(currentDay,`d${currentDay}-t${i}`)).length;const pct=Math.round(done/d.tasks.length*100);$('todayPct').textContent=pct+'%';$('todayBar').style.width=pct+'%';"
          ))
          replacements.append((
            "async function toggleTask(day,key,el){\n  try{await api('/api/student/progress',{method:'POST',body:{dayNo:day,taskKey:key,isDone:el.checked}});const existing=state.progress.find(p=>Number(p.day_no)===day&&p.task_key===key);if(existing)existing.is_done=el.checked?1:0;else state.progress.push({day_no:day,task_key:key,is_done:el.checked?1:0});renderStudent();toast(el.checked?'Disimpan ✓':'Tugasan dibuka semula')}catch(e){el.checked=!el.checked;toast(e.message)}\n}",
            "async function saveTaskProgress(day,key,isDone){\n  await api('/api/student/progress',{method:'POST',body:{dayNo:day,taskKey:key,isDone}});\n  const existing=state.progress.find(p=>Number(p.day_no)===day&&p.task_key===key);\n  if(existing){existing.is_done=isDone?1:0;existing.completed_at=isDone?new Date().toISOString():null}else state.progress.push({day_no:day,task_key:key,is_done:isDone?1:0,completed_at:isDone?new Date().toISOString():null});\n}\nasync function toggleTask(day,key,el){\n  try{await saveTaskProgress(day,key,el.checked);renderStudent();toast(el.checked?'Disimpan ✓':'Tugasan dibuka semula')}catch(e){el.checked=!el.checked;toast(e.message)}\n}\nfunction taskSubject(title){const t=String(title).toLowerCase();if(t.includes('math'))return 'Math';if(t.includes('science')||t.includes('sains')||t.includes('stem'))return 'Science';if(t.includes('english')||t.includes('vocabulary'))return 'English';if(t.includes('bm')||t.includes('bahasa melayu'))return 'BM';return null}\nfunction startMission(){\n  const d=DAYS[currentDay-1];let idx=d.tasks.findIndex((_,i)=>!progressDone(currentDay,`d${currentDay}-t${i}`));if(idx<0)idx=0;startTaskModule(currentDay,idx);\n}\nfunction startTaskModule(day,index){\n  currentDay=day;const title=DAYS[day-1].tasks[index];const key=`d${day}-t${index}`;const subject=taskSubject(title);currentTask={day,index,key,title,subject};renderDays();renderTasks();\n  if(subject)newQuestion(subject);else{currentQuiz=null;$('quizSubject').textContent=`Day ${day} • Aktiviti`;$('quizQuestion').textContent=title;$('quizTranslate').textContent='Buat aktiviti ini dahulu. Bila selesai, tekan Tandakan siap.';$('answers').innerHTML='<button class=\"soft\" onclick=\"completeCurrentTask()\">✓ Tandakan aktiviti siap</button>';}\n  renderMissionContext();go('learn');\n}\nfunction renderMissionContext(){\n  const el=$('missionContext');if(!el)return;if(!currentTask){el.classList.add('hidden');el.innerHTML='';return}\n  const done=progressDone(currentTask.day,currentTask.key);el.classList.remove('hidden');el.innerHTML=`<b>Day ${currentTask.day} • ${safe(currentTask.title)}</b><br><small>${done?'Progress modul ini sudah disimpan ✓':'Selesaikan modul ini. Untuk quiz, jawab betul untuk auto-complete.'}</small>${done?` <button class=\"btn soft\" onclick=\"selectDay(${currentTask.day});go('home')\">Kembali Day ${currentTask.day}</button>`:''}`;\n}\nasync function completeCurrentTask(){if(!currentTask)return;try{await saveTaskProgress(currentTask.day,currentTask.key,true);renderStudent();renderMissionContext();toast('Modul selesai & sync ✓')}catch(e){toast(e.message)}}"
          ))
          replacements.append((
            "function go(name){\n  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const target=$('screen-'+name);if(target)target.classList.add('active');\n  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));\n}",
            "function go(name){\n  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const target=$('screen-'+name);if(target)target.classList.add('active');\n  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));\n  requestAnimationFrame(()=>window.scrollTo({top:0,behavior:'smooth'}));\n}"
          ))
          replacements.append((
            "function newQuestion(subject){\n  const list=QUIZ[subject];currentQuiz={subject,q:list[Math.floor(Math.random()*list.length)],answered:false};",
            "function newQuestion(subject){\n  const list=QUIZ[subject];if(!Array.isArray(list)||!list.length){toast('Modul belum ada soalan');return}quizCursor[subject]=(quizCursor[subject]+1)%list.length;currentQuiz={subject,q:list[quizCursor[subject]],answered:false};"
          ))
          replacements.append((
            "    state.stats={...state.stats,...d.stats};toast(correct?'Betul! +10 XP 🎉':'Belum tepat — masuk Buku Silap');\n    setTimeout(async()=>{await loadStudentState();newQuestion(currentQuiz.subject)},850);\n  }catch(e){toast(e.message)}",
            "    state.stats={...state.stats,...d.stats};\n    if(correct&&currentTask&&currentTask.subject===currentQuiz.subject&&!progressDone(currentTask.day,currentTask.key)){await saveTaskProgress(currentTask.day,currentTask.key,true)}\n    toast(correct?'Betul! Modul & XP dikemas kini 🎉':'Belum tepat — masuk Buku Silap');\n    const nextSubject=currentQuiz.subject;setTimeout(async()=>{await loadStudentState();renderMissionContext();if(!correct)newQuestion(nextSubject)},1200);\n  }catch(e){currentQuiz.answered=false;[...$('answers').children].forEach(b=>b.classList.remove('correct','wrong'));toast(e.message)}"
          ))
          replacements.append((
            "function renderMistakes(){",
            "function renderRewards(){\n  const completed=(state.progress||[]).filter(p=>Number(p.is_done)===1).length;const mastered=(state.mistakes||[]).filter(m=>m.status==='mastered').length;const allDays=DAYS.every((_,i)=>dayDone(i+1));const badges=[['🌱','Starter',completed>0||(state.stats?.xp||0)>0,'Mula satu aktiviti'],['📚','Consistent Learner',completed>=20,'Lengkap 20 tugasan'],['🧠','Error Hunter',mastered>0,'Baiki sekurang-kurangnya 1 kesalahan'],['🏅','MATRIX Warrior',allDays,'Lengkap Day 1–Day 8']];$('badgeList').innerHTML=badges.map(b=>`<p>${b[2]?'✅':'🔒'} ${b[0]} <b>${b[1]}</b><br><small class=\"muted\">${b[3]}</small></p>`).join('');\n}\nfunction renderMistakes(){"
          ))
          replacements.append((
            ".task .tag{grid-column:2;justify-self:start;font-size:9px;padding:3px 6px;margin-top:-3px}",
            ".task .tag{grid-column:2;justify-self:start;font-size:9px;padding:3px 6px;margin-top:-3px}.task .task-open{grid-column:2;justify-self:start;padding:7px 10px;font-size:11px;margin-top:-2px}"
          ))

          for old,new in replacements:
              if old not in text:
                  raise SystemExit('Expected source fragment not found; refusing partial repair: '+old[:100])
              text = text.replace(old,new,1)

          path.write_text(text)
      - name: Verify repository
        run: |
          node --check src/index.js
          node scripts/verify-static.mjs
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('index.html','utf8');
          for (const x of ['function startMission()','function startTaskModule(','function saveTaskProgress(','function renderRewards()','window.scrollTo({top:0']) if(!s.includes(x)) throw new Error('missing '+x);
          console.log('Functional learning module contracts present.');
          NODE
      - name: Commit functional repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make Day modules interactive and stateful'
          git push origin HEAD:main
