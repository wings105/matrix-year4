name: Mobile layout polish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch mobile dashboard CSS
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = """@media(max-width:760px){.gate{padding:14px}.gate-grid{grid-template-columns:1fr}.gate-brand h1{font-size:28px}.app{grid-template-columns:1fr}.side{position:fixed;z-index:20;left:0;right:0;bottom:0;top:auto;height:auto;padding:7px}.brand,.sidebox{display:none}.nav{grid-template-columns:repeat(5,1fr);gap:3px}.nav button{font-size:0;text-align:center;padding:10px 5px}.nav button span{font-size:19px}.main{padding:15px 15px 82px}.top{align-items:flex-start}.top h1{font-size:22px}.hero{grid-template-columns:1fr;padding:20px}.hero h2{font-size:28px}.mascot{display:none}.grid5{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.layout>.panel:last-child{grid-column:auto}.settings-grid,.parent-grid{grid-template-columns:1fr}.chips{justify-content:flex-end}}"""
          new = """@media(max-width:760px){
            body{font-size:14px;overflow-x:hidden}
            .gate{padding:12px}.gate-grid{grid-template-columns:1fr}.gate-brand{margin-bottom:14px}.gate-brand .logo{font-size:48px}.gate-brand h1{font-size:27px}.gate-card{padding:17px}
            .app{grid-template-columns:1fr}.side{position:fixed;z-index:20;left:0;right:0;bottom:0;top:auto;height:auto;padding:7px 8px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 26px #082d6926}.brand,.sidebox{display:none}.nav{grid-template-columns:repeat(5,1fr);gap:4px}.nav button{font-size:0;text-align:center;padding:9px 5px;border-radius:11px}.nav button span{font-size:20px}
            .main{padding:12px 12px calc(78px + env(safe-area-inset-bottom));width:100%;max-width:100vw;overflow-x:hidden}.top{display:grid;grid-template-columns:1fr;gap:10px;align-items:start;margin-bottom:12px}.top h1{font-size:21px;line-height:1.15}.top .muted{font-size:12px;line-height:1.35}.chips{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;justify-content:stretch}.chip{min-width:0;padding:7px 9px;font-size:12px;white-space:nowrap}.chips .chip:first-child{overflow:hidden;text-overflow:ellipsis}
            .hero{grid-template-columns:1fr;padding:16px;border-radius:20px}.hero h2{font-size:22px;line-height:1.15}.hero p{font-size:12px;line-height:1.4;margin-bottom:13px}.hero .btn{width:100%;padding:10px 12px}.mascot{display:none}
            .grid5{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.grid5 .metric:first-child{grid-column:1/-1}.metric{padding:11px;border-radius:16px;min-width:0}.metric small{font-size:11px}.metric b{font-size:19px}
            .layout{grid-template-columns:1fr;gap:11px;margin-top:12px}.layout>.panel:last-child{grid-column:auto}.panel{padding:14px;border-radius:18px;min-width:0}.panel h3{font-size:15px;margin-bottom:10px}
            .days{gap:6px;margin-right:-2px}.day{min-width:40px;width:40px;height:40px;font-size:12px}.day.current{border-width:3px}.theme{padding:10px;margin:10px 0}.theme b{font-size:13px}.theme small{font-size:11px}
            .task{grid-template-columns:auto minmax(0,1fr);gap:8px 9px;align-items:start;padding:9px 0}.task input{width:18px;height:18px;margin-top:2px}.task b{font-size:12px;line-height:1.3}.task small{display:block;font-size:10px;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}.task .tag{grid-column:2;justify-self:start;font-size:9px;padding:3px 6px;margin-top:-3px}
            .subject{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;padding:10px;margin:8px 0;min-width:0}.subject .ico{font-size:23px}.subject .grow{min-width:0}.subject .grow b{display:block;font-size:12px;line-height:1.2;white-space:normal}.subject .grow small{display:block;font-size:10px;margin-top:2px}.subject .btn{padding:8px 10px;font-size:11px;white-space:nowrap}
            .topic{align-items:flex-start;padding:8px 5px}.topic b{font-size:12px}.topic small{display:block;font-size:10px;line-height:1.25}
            .settings-grid,.parent-grid{grid-template-columns:1fr}.settings-grid .btn,.parent-grid .btn{max-width:100%}.code-box{font-size:25px;letter-spacing:3px}
            .toast{left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));text-align:center;font-size:13px}
          }
          @media(max-width:380px){.main{padding-left:9px;padding-right:9px}.chips{grid-template-columns:1fr auto auto}.chip{padding:6px 7px}.grid5{gap:6px}.panel{padding:12px}.subject{grid-template-columns:auto minmax(0,1fr)}.subject .btn{grid-column:2;justify-self:start}.day{min-width:38px;width:38px;height:38px}}"""
          if old not in text:
              raise SystemExit('Expected original mobile media rule was not found; refusing unsafe patch.')
          path.write_text(text.replace(old, new, 1))
      - name: Verify repository
        run: |
          node --check src/index.js
          node scripts/verify-static.mjs
      - name: Commit mobile polish
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish mobile dashboard layout'
          git push origin HEAD:main
